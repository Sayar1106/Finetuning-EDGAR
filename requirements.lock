# Locked dependency versions for the data, labeling, and eval path.
#
# Scope: base dependencies plus the `labels`, `eval`, and `dev` extras -- the exact environment
# that produced data/processed/*.jsonl and runs the eval harness. It deliberately does NOT cover
# the `train` extras (torch, transformers, trl, peft, bitsandbytes, unsloth, accelerate): those are
# never installed on this machine (see D13 and I4 -- the local disk cannot hold them), so a lock
# generated here would be a guess. Lock those on the GPU host at training time and commit the
# result as requirements-train.lock.
#
# Why this file exists: pyproject.toml pins only lower bounds (`>=`), so the same commit resolves
# to different versions over time. That already bit the project once through ruff (see D24).
#
# Regenerate with:  .venv/bin/python -m pip freeze --exclude-editable > requirements.lock
# Generated 2026-07-29 on Python 3.10.8 (darwin/arm64).
